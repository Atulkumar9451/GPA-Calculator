<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  display: flex;
  justify-content: center;
  margin-top: 50px;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 10px;
  width: 400px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  text-align: center;
}

h1 {
  margin-bottom: 20px;
}

table {
  width: 100%;
  margin-bottom: 15px;
}

th, td {
  padding: 8px;
}

input, select {
  width: 90%;
  padding: 5px;
}

button {
  margin: 5px;
  padding: 10px;
  border: none;
  background: #007bff;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #0056b3;
}
</style>

</head>
<body>

<div class="container">
  <h1>GPA Calculator</h1>

  <table id="gradeTable">
    <tr>
      <th>Subject</th>
      <th>Grade</th>
      <th>Credits</th>
    </tr>
  </table>

  <button onclick="addRow()">Add Subject</button>
  <button onclick="calculateGPA()">Calculate GPA</button>

  <h2 id="result">GPA: 0.00</h2>
</div>

<script>
function addRow() {
  const table = document.getElementById("gradeTable");
  const row = table.insertRow();

  row.innerHTML = `
    <td><input type="text" placeholder="Subject"></td>
    <td>
      <select>
        <option value="10">A+</option>
        <option value="9">A</option>
        <option value="8">B+</option>
        <option value="7">B</option>
        <option value="6">C</option>
        <option value="5">D</option>
        <option value="0">F</option>
      </select>
    </td>
    <td><input type="number" min="1" value="3"></td>
  `;
}

function calculateGPA() {
  const table = document.getElementById("gradeTable");
  let totalPoints = 0;
  let totalCredits = 0;

  for (let i = 1; i < table.rows.length; i++) {
    const grade = parseFloat(table.rows[i].cells[1].children[0].value);
    const credits = parseFloat(table.rows[i].cells[2].children[0].value);

    totalPoints += grade * credits;
    totalCredits += credits;
  }

  const gpa = totalCredits ? (totalPoints / totalCredits).toFixed(2) : 0;

  document.getElementById("result").innerText = "GPA: " + gpa;
}
</script>

</body>
</html>
