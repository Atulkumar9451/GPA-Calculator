```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPA Calculator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf2ff, #f8f9fc);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 15px;
}

.container {
  width: 100%;
  max-width: 850px;
  background: #ffffff;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  color: #1f2937;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin-bottom: 25px;
}

.table-wrapper {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 20px;
}

th {
  background: #007bff;
  color: white;
  padding: 12px;
  text-align: left;
}

td {
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
}

input,
select {
  width: 100%;
  padding: 9px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  outline: none;
  font-size: 14px;
}

input:focus,
select:focus {
  border-color: #007bff;
  box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.1);
}

button {
  border: none;
  padding: 10px 16px;
  border-radius: 7px;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  margin: 4px;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
}

.add-btn {
  background: #007bff;
}

.calculate-btn {
  background: #198754;
}

.reset-btn {
  background: #dc3545;
}

.delete-btn {
  background: #dc3545;
  padding: 8px 12px;
}

.button-container {
  text-align: center;
  margin-bottom: 25px;
}

.result-box {
  background: #f0f7ff;
  border: 1px solid #cfe3ff;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.result-box h2 {
  margin: 0;
  color: #007bff;
  font-size: 28px;
}

.result-box p {
  margin: 8px 0 0;
  color: #6b7280;
}

.message {
  text-align: center;
  color: #dc3545;
  font-size: 14px;
  margin-bottom: 10px;
  min-height: 18px;
}

@media (max-width: 600px) {
  .container {
    padding: 20px 15px;
  }

  th,
  td {
    padding: 7px;
    font-size: 13px;
  }

  button {
    width: 100%;
    margin: 5px 0;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>GPA Calculator</h1>
  <p class="subtitle">
    Add your subjects, grades and credit hours to calculate your GPA.
  </p>

  <div class="table-wrapper">
    <table id="gradeTable">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Grade</th>
          <th>Credits</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <div id="message" class="message"></div>

  <div class="button-container">
    <button class="add-btn" onclick="addRow()">
      + Add Subject
    </button>

    <button class="calculate-btn" onclick="calculateGPA()">
      Calculate GPA
    </button>

    <button class="reset-btn" onclick="resetCalculator()">
      Reset
    </button>
  </div>

  <div class="result-box">
    <h2 id="result">GPA: 0.00</h2>
    <p id="summary">Total Credits: 0</p>
  </div>

</div>

<script>

const gradePoints = {
  "A+": 10,
  "A": 9,
  "B+": 8,
  "B": 7,
  "C": 6,
  "D": 5,
  "F": 0
};

function addRow() {

  const tbody = document.getElementById("tableBody");

  const row = document.createElement("tr");

  row.innerHTML = `
    <td>
      <input
        type="text"
        placeholder="Subject name"
        class="subject"
      >
    </td>

    <td>
      <select class="grade">
        <option value="">Select</option>
        <option value="A+">A+</option>
        <option value="A">A</option>
        <option value="B+">B+</option>
        <option value="B">B</option>
        <option value="C">C</option>
        <option value="D">D</option>
        <option value="F">F</option>
      </select>
    </td>

    <td>
      <input
        type="number"
        min="1"
        max="20"
        value="3"
        class="credits"
      >
    </td>

    <td>
      <button
        class="delete-btn"
        onclick="deleteRow(this)"
      >
        Delete
      </button>
    </td>
  `;

  tbody.appendChild(row);
}

function deleteRow(button) {

  button.closest("tr").remove();

  calculateGPA();
}

function calculateGPA() {

  const rows = document.querySelectorAll("#tableBody tr");

  let totalPoints = 0;
  let totalCredits = 0;

  const message = document.getElementById("message");

  message.textContent = "";

  if (rows.length === 0) {

    message.textContent = "Please add at least one subject.";

    document.getElementById("result").textContent = "GPA: 0.00";
    document.getElementById("summary").textContent = "Total Credits: 0";

    return;
  }

  for (let row of rows) {

    const grade = row.querySelector(".grade").value;
    const credits = parseFloat(
      row.querySelector(".credits").value
    );

    if (!grade) {
      message.textContent = "Please select a grade for every subject.";
      return;
    }

    if (!credits || credits <= 0) {
      message.textContent =
        "Credits must be greater than 0.";
      return;
    }

    totalPoints += gradePoints[grade] * credits;
    totalCredits += credits;
  }

  const gpa = totalPoints / totalCredits;

  document.getElementById("result").textContent =
    `GPA: ${gpa.toFixed(2)}`;

  document.getElementById("summary").textContent =
    `Total Credits: ${totalCredits}`;
}

function resetCalculator() {

  document.getElementById("tableBody").innerHTML = "";

  document.getElementById("result").textContent =
    "GPA: 0.00";

  document.getElementById("summary").textContent =
    "Total Credits: 0";

  document.getElementById("message").textContent = "";

  addRow();
}

// Add first subject automatically
addRow();

</script>

</body>
</html>
